[workspace]
members = [".", "crates/kitty-rc"]

[package]
name = "tai"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream", "libc"] }
kitty-rc = { path = "crates/kitty-rc" }
ratatui = { version = "0.30.0", features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.0", features = ["v4"] }
# llm = "1.3.7"
async-trait = "0.1.89"
rustyline-async = "0.4.9"
futures-util = "0.3.32"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing-errors-doc = "allow"
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
tempfile = "3.27.0"
